<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="icon.png">
    <title>Исследование информационных потребностей учащихся</title>
    <link rel="stylesheet" href="eelibs/import.css">
    <link rel="stylesheet" href="css/poll.css">
    <link rel="stylesheet" href="css/adaptivity/desktop.css">
    <link rel="stylesheet" href="css/adaptivity/mobile.css">
</head>
<body style="display: flex;">
    <div id="nav" class="">
        <button id="openmenu" onclick="openNavPanel()"><img src="img/ui/lines.svg"></button>
        <div id="navcontent"></div>
    </div>
    <div id="content" class="">
        <div class="page" id="settings"></div>
        <div class="page block" id="poll">
            <div class="pageContainer">
                <div class="pageContent">

                </div>
            </div>
        </div>
        <div class="page block" id="end">
            <div class="pageContainer">
                <div class="pageContent">
                    <!--button id="endReturnBtn" class="aBtn" onclick="changePage('poll')">
                        <img src="img/ui/back.svg"><span>Return</span>
                    </button-->
                </div>
            </div>
        </div>
        <div class="page block" id="about">
            <div class="pageContainer">
                <div class="pageContent">
                    <div class="linfoCard fullwidth" id="aboutAppCard">
                        <p id="aboutAppDescr">Приложение для отображения расписания уроков и звонков.</p>
                        <p id="aboutAppVersion"></p>
                    </div>
                    <div class="linfoCard fullwidth" id="aboutRuntimeCard">
                        <b>Информация о работе</b>
                        <div id="aboutRuntimeInfo" class="aboutRuntimeInfo"></div>
                    </div>

                    <div class="linfoCard fullwidth" id="updatesCard">
                        <b id="updatesTitle">Обновления</b>
                        <div class="lessonInfoData">
                            <label>
                                <span id="updateAutoCheckLabel">Проверять автоматически</span>
                                <input type="checkbox" id="updateAutoCheckToggle">
                            </label>
                        </div>
                        <p id="updateStatus"></p>
                    </div>

                    <div class="downBtns">
                        <div class="aBtn" id="checkUpdateBtn"><img src="img/ui/reload.svg"><p id="checkUpdateBtnText">Проверить обновления</p></div>
                        <a class="aBtn" href="https://github.com/EE-Apps/BellSchedule" target="_blank" id="aboutRepoLink"><img src="img/ui/file/open.svg">Исходный код на GitHub</a>
                    </div>
                </div>
            </div>
        </div>
        <div id="navdown" class="hidden"></div>
    </div>

    <div id="modal" class="modal"><div id="modalForuse"></div></div>

</body>
<script src="eelib-poll.js" type="module"></script>
<script src="js/translations.js"></script>
<script src="js/locales/ru.js"></script>
<script src="js/locales/en.js"></script>
<script src="js/locales/uk.js"></script>
<script src="eelibs/import.js" type="module"></script>
<script src="js/poll.js"></script>
</html>
