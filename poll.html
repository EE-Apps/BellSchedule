<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" href="icon.png">
    <title>Исследование информационных потребностей учащихся</title>
    <link rel="stylesheet" href="eelibs/import.css">
    <link rel="stylesheet" href="css/poll.css">
    <link rel="stylesheet" href="css/adaptivity/desktop.css">
    <link rel="stylesheet" href="css/adaptivity/mobile.css">
</head>
<body style="display: flex;">
    <div id="nav" class="">
        <button id="openmenu" onclick="openNavPanel()"><img src="img/ui/lines.svg"></button>
        <div id="navcontent"></div>
    </div>
    <div id="content" class="">
        <div class="page" id="settings"></div>
        <div class="page block" id="poll">
            <div class="pageContainer">
                <div class="pageContent">

                </div>
            </div>
        </div>
        <div class="page block" id="end">
            <div class="pageContainer">
                <div class="pageContent">
                    <!--button id="endReturnBtn" class="aBtn" onclick="changePage('poll')">
                        <img src="img/ui/back.svg"><span>Return</span>
                    </button-->
                    <div style="
                        position: absolute;
                        z-index: 0;
                        bottom: 0;
                        top: 0;
                        left: 0;
                        right: 0;
                        width: 100%;
                        height: 100%;
                        object-fit: cover;
                        width: 100%;
                        align-items: center;
                    ">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" style="
                            min-width: 100dvw;
                            min-height: 100dvh;
                            position: absolute;
                            left: -50%;
                            filter: brightness(50%);">
                            <defs>
                                <radialGradient id="s-0" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="100" y2="100">
                                    <stop offset="0" stop-color="hsla(209,80%,45%,1)"></stop>
                                    <stop offset="1" stop-color="hsla(209,80%,45%,0)" stop-opacity="0"></stop>
                                </radialGradient>
                                <radialGradient id="s-1" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="100" y2="100">
                                    <stop offset="0" stop-color="hsla(164,50%,40%,1)"></stop>
                                    <stop offset="1" stop-color="hsla(164,50%,40%,0)" stop-opacity="0"></stop>
                                </radialGradient>
                                <radialGradient id="s-2" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="100" y2="100">
                                    <stop offset="0" stop-color="hsla(211,50%,45%,1)"></stop>
                                    <stop offset="1" stop-color="hsla(211,50%,45%,0)" stop-opacity="0"></stop>
                                </radialGradient>
                                <radialGradient id="s-3" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="100" y2="100">
                                    <stop offset="0" stop-color="hsla(142,70%,40%,1)"></stop>
                                    <stop offset="1" stop-color="hsla(142,70%,40%,0)" stop-opacity="0"></stop>
                                </radialGradient>
                                <radialGradient id="s-4" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="100" y2="100">
                                    <stop offset="0" stop-color="hsla(238,40%,35%,1)"></stop>
                                    <stop offset="1" stop-color="hsla(238,40%,35%,0)" stop-opacity="0"></stop>
                                </radialGradient>
                            </defs>
                            <!-- Глубокий темный фон вместо неоново-фиолетового -->
                            <rect fill="hsla(240, 25%, 10%, 1)" width="100%" height="100%"></rect>
                            <ellipse cx="13%" cy="2%" ry="60%" rx="65%" fill="url(#s-4)"></ellipse>
                            <ellipse cx="76%" cy="51%" ry="60%" rx="65%" fill="url(#s-3)"></ellipse>
                            <ellipse cx="15%" cy="91%" ry="60%" rx="65%" fill="url(#s-2)"></ellipse>
                            <ellipse cx="88%" cy="25%" ry="60%" rx="65%" fill="url(#s-1)"></ellipse>
                            <ellipse cx="47%" cy="59%" ry="60%" rx="65%" fill="url(#s-0)"></ellipse>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
        <div class="page block" id="about">
            <div class="pageContainer">
                <div class="pageContent">
                    <div class="linfoCard fullwidth" id="aboutAppCard">
                        <p id="aboutAppDescr">Приложение для отображения расписания уроков и звонков.</p>
                        <p id="aboutAppVersion"></p>
                    </div>
                    <div class="linfoCard fullwidth" id="aboutRuntimeCard">
                        <b>Информация о работе</b>
                        <div id="aboutRuntimeInfo" class="aboutRuntimeInfo"></div>
                    </div>

                    <div class="linfoCard fullwidth" id="updatesCard">
                        <b id="updatesTitle">Обновления</b>
                        <div class="lessonInfoData">
                            <label>
                                <span id="updateAutoCheckLabel">Проверять автоматически</span>
                                <input type="checkbox" id="updateAutoCheckToggle">
                            </label>
                        </div>
                        <p id="updateStatus"></p>
                    </div>

                    <div class="downBtns">
                        <div class="aBtn" id="checkUpdateBtn"><img src="img/ui/reload.svg"><p id="checkUpdateBtnText">Проверить обновления</p></div>
                        <a class="aBtn" href="https://github.com/EE-Apps/BellSchedule" target="_blank" id="aboutRepoLink"><img src="img/ui/file/open.svg">Исходный код на GitHub</a>
                    </div>
                </div>
            </div>
        </div>
        <div id="navdown" class="hidden"></div>
    </div>

    <div id="modal" class="modal"><div id="modalForuse"></div></div>
    <div id="welcome" class="active">
        <div style="
            position: absolute;
            z-index: 0;
            bottom: 0;
            top: 0;
            left: 0;
            right: 0;
            width: 100dvw;
            height: 100dvh;
            overflow: hidden;
            object-fit: cover;
            align-items: center;
        ">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" style="
                min-width: 100dvw;
                min-height: 100dvh;
                position: absolute;
                left: 0;
                filter: brightness(50%);">
                <defs>
                    <radialGradient id="s-0" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="100" y2="100">
                        <stop offset="0" stop-color="hsla(209,80%,45%,1)"></stop>
                        <stop offset="1" stop-color="hsla(209,80%,45%,0)" stop-opacity="0"></stop>
                    </radialGradient>
                    <radialGradient id="s-1" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="100" y2="100">
                        <stop offset="0" stop-color="hsla(164,50%,40%,1)"></stop>
                        <stop offset="1" stop-color="hsla(164,50%,40%,0)" stop-opacity="0"></stop>
                    </radialGradient>
                    <radialGradient id="s-2" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="100" y2="100">
                        <stop offset="0" stop-color="hsla(211,50%,45%,1)"></stop>
                        <stop offset="1" stop-color="hsla(211,50%,45%,0)" stop-opacity="0"></stop>
                    </radialGradient>
                    <radialGradient id="s-3" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="100" y2="100">
                        <stop offset="0" stop-color="hsla(142,70%,40%,1)"></stop>
                        <stop offset="1" stop-color="hsla(142,70%,40%,0)" stop-opacity="0"></stop>
                    </radialGradient>
                    <radialGradient id="s-4" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="100" y2="100">
                        <stop offset="0" stop-color="hsla(238,40%,35%,1)"></stop>
                        <stop offset="1" stop-color="hsla(238,40%,35%,0)" stop-opacity="0"></stop>
                    </radialGradient>
                </defs>
                <!-- Глубокий темный фон вместо неоново-фиолетового -->
                <rect fill="hsla(240, 25%, 10%, 1)" width="100%" height="100%"></rect>
                <ellipse cx="13%" cy="2%" ry="60%" rx="65%" fill="url(#s-4)"></ellipse>
                <ellipse cx="76%" cy="51%" ry="60%" rx="65%" fill="url(#s-3)"></ellipse>
                <ellipse cx="15%" cy="91%" ry="60%" rx="65%" fill="url(#s-2)"></ellipse>
                <ellipse cx="88%" cy="25%" ry="60%" rx="65%" fill="url(#s-1)"></ellipse>
                <ellipse cx="47%" cy="59%" ry="60%" rx="65%" fill="url(#s-0)"></ellipse>
            </svg>
        </div>
        <div id="welcomeText">
            <h1>Hello!</h1>
            <p>description</p>
            <div id="welcomeLang">
                <button id="welcomeLang-en" class="aBtn trBtn" data-lang="en">Eng</button>
                <button id="welcomeLang-ru" class="aBtn trBtn" data-lang="ru">Рус</button>
                <button id="welcomeLang-uk" class="aBtn trBtn" data-lang="uk">Укр</button>
            </div>
        </div>
        <button id="welcomeBtn" class="aBtn trBtn" onclick="document.getElementById('welcome').classList.remove('active')">Start</button>
    </div>

</body>
<script src="eelib-poll.js" type="module"></script>
<script src="js/translations.js"></script>
<script src="js/locales/ru.js"></script>
<script src="js/locales/en.js"></script>
<script src="js/locales/uk.js"></script>
<script src="eelibs/import.js" type="module"></script>
<script src="js/poll.js"></script>
</html>
